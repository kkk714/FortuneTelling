services:
  - type: web
    name: fortune-telling-api
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r requirements-api.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SUANMING_CORS_ORIGINS
        value: https://doc-to-dreamsite.lovable.app,https://preview--doc-to-dreamsite.lovable.app,https://id-preview--20989e88-1876-429e-accf-5a000bbdbaa3.lovable.app,https://20989e88-1876-429e-accf-5a000bbdbaa3.lovableproject.com
# Deployed from the public repository URL. Trigger future code deploys manually.
# These are this Lovable project's configured publish domain and preview origins.
